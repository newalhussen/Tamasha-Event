# Local PostgreSQL for development: `docker compose up -d`
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: tamasha
      POSTGRES_PASSWORD: tamasha
      POSTGRES_DB: tamasha
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
